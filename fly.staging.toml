# fly.toml app configuration file generated for review-project on 2026-11-23T15:49:23Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'review-project'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Provision separately before deploying; Base64 of the matching coturn secret.
[[files]]
  guest_path = "/app/secrets/conference-turn-secret"
  secret_name = "CONFERENCE_TURN_SECRET_B64"

[deploy]
  release_command = "/app/bin/review_project eval 'ReviewProject.Release.migrate()'"

[env]
  DATABASE_CA_CERT_FILE = '/app/certificates/supabase-root-ca.crt'
  DATABASE_SSL = 'true'
  ECTO_IPV6 = 'true'
  PHX_HOST = 'review-project.fly.dev'
  CONFERENCE_ICE_CONFIG = '/app/conference/staging-ice.json'
  PHX_SERVER = 'true'
  POOL_SIZE = '3'
  PORT = '8080'
  UPLOADED_VIDEO_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
