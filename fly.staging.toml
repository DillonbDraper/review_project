# Draft app name; availability has not been confirmed or reserved.
app = "review-project-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "review-project-staging.fly.dev"
  PHX_SERVER = "true"
  PORT = "8080"
  POOL_SIZE = "3"
  ECTO_IPV6 = "true"
  DATABASE_SSL = "true"
  DATABASE_CA_CERT_FILE = "/app/certificates/supabase-root-ca.crt"

[deploy]
  release_command = "/app/bin/review_project eval 'ReviewProject.Release.migrate()'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
